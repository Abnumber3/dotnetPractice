<div class="container">
  <div class="row" *ngIf="product">
    <div class="col-6 d-flex justify-content-center align-items-center">
      <img [src]="product.pictureUrl" [alt]="product.name" class="w-85" />
    </div>
    <div class="col-6 mt-5">
      <h2>{{ product.name }}</h2>
      <p style="font-size: 2em">{{ product.price | currency }}</p>

      <p style="font-size: 1.3em; color: coral">
        Number of this item in your cart: {{ currentProductQuantity$ | async }}
      </p>

      <div class="d-flex justify content-start align-items-center">
        <i
          (click)="decreaseItemQuantity()"
          class="fa fa-minus-circle text-warning me-2"
          style="cursor: pointer; font-size: 2em"
        ></i>
        <span class="font-weight-bold" style="font-size: 1.5em">{{
          productQuantity
        }}</span>
        <i
          (click)="increaseItemQuantity()"
          class="fa fa-plus-circle text-warning ms-2"
          style="cursor: pointer; font-size: 2em"
        ></i>
        <button
          (click)="addToCart(product)"
          class="btn btn-outline-secondary ms-4"
        >
          Add to cart
        </button>
      </div>

      <div class="row mt-4">
        <h4>Description</h4>
        <p>{{ product.description }}</p>
      </div>
    </div>
  </div>
</div>
