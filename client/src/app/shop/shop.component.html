<div class="container">
  <div class="row">
    <section class="col-3" style="cursor: pointer">
      <h5 class="text-warning ms-3">Sort</h5>
      <select class="form-select mb-4" (change)="onSortSelected($event)">
        <option *ngFor="let sort of sortOptions" [value]="sort.value">
          {{ sort.name }}
        </option>
        >
      </select>

      <h5 class="text-warning ms-3">Brands</h5>
      <ul class="list-group my-3">
        <li
          class="list-group-item"
          *ngFor="let brand of Brands"
          (click)="onBrandSelected(brand.id)"
          [value]="brand.id"
          [class.active]="brand.id === shopParams.brandId"
        >
          {{ brand.name }}
        </li>
      </ul>

      <h5 class="text-warning ms-3">Types</h5>

      <ul class="list-group my-3">
        <li
          class="list-group-item"
          *ngFor="let type of Types"
          (click)="onTypeSelected(type.id)"
          [class.active]="type.id === shopParams.typeId"
        >
          {{ type.name }}
        </li>
      </ul>
    </section>

    <section class="col-9">
      <div class="d-flex justify-content-between align-items center pb-2">
        <app-paging-header
        [pageNumber]="shopParams.pageNumber"
        [pageSize]="shopParams.pageSize"
        [totalCount]="totalCount"
        ></app-paging-header>

        <div class="d-flex mt-2">
          <input type="text" placeholder="Search" class="form-control me-2" />
          <button class="btn btn-outline-primary mx-2">Search</button>
          <button class="btn btn-outline-success">Reset</button>
        </div>
      </div>
      <div class="row row-cols-3 g-3 mb-4">
        <div class="col" *ngFor="let products of Products">
          <app-product-item [product]="products"></app-product-item>
        </div>
      </div>
      <div class="d-flex justify-content-center">
        <pagination
          [boundaryLinks]="true"
          [totalItems]="totalCount"
          [itemsPerPage]="shopParams.pageSize"
          [maxSize]="10"
          (pageChanged)="onPageChanged($event)"
          previousText="&lsaquo;"
          nextText="&rsaquo;"
          firstText="&laquo;"
          lastText="&raquo;"
        >
        </pagination>
      </div>
    </section>
  </div>
</div>
