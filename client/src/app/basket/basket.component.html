
<ng-container *ngIf="basketService.basketSource$ | async as basket; else emptyBasket">
  <div class="container mt-5" *ngIf="basket.items.length > 0; else emptyBasket">
    <div class="row">
      <div class="table-responsive">
        <table class="table">
          <thead class="table-light text-uppercase">
            <tr>
              <th class="py-2">Product</th>
              <th class="py-2">Price</th>
              <th class="py-2">Quantity</th>
              <th class="py-2">Total</th>
              <th class="py-2">Remove</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let item of basket.items">
              <th scope="row">
                <div class="p-2 d-inline-block">
                  <img
                    [src]="item.pictureUrl"
                    [alt]="item.productName"
                    class="img-fluid"
                    style="max-height: 50px;"
                  />

                  <div class="ms-3 d-inline-block align-middle">
                    <h5 class="mb-0">
                      <span class="text-dark">
                        {{ item.productName }}
                      </span>
                    </h5>
                    <span class="text-muted fst-italic">
                      Type: {{ item.productType }}
                    </span>
                  </div>
                </div>
              </th>

              <td class="align-middle">
                <strong>{{ item.price | currency }}</strong>
              </td>

              <td class="align-middle">
                <div class="d-flex align-items-center">
                  <i
                    (click)="decreaseFromBasket(item)"
                    class="fa fa-minus-circle text-warning me-2"
                    style="cursor: pointer; font-size: 2em;"
                  ></i>

                  <strong class="mx-2">
                    {{ item.quantity }}
                  </strong>

                  <i
                    (click)="addToBasket(item)"
                    class="fa fa-plus-circle text-warning ms-2"
                    style="cursor: pointer; font-size: 2em;"
                  ></i>
                </div>
              </td>

              <td class="align-middle">
                <strong>
                  {{ item.price * item.quantity | currency }}
                </strong>
              </td>

              <td class="align-middle">
                <i
                  class="fa fa-trash text-danger"
                  style="font-size: 2em; cursor: pointer;"
                ></i>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #emptyBasket>
  <div class="container mt-5">
    <p>There are no items in your basket</p>
  </div>
</ng-template>
